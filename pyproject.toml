[project]
name = "siegegraph"
version = "0.1.0"
description = "Attack-path mapping and evidence management for authorized penetration testing engagements."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ernest Kosmatko" }]
dependencies = [
    "typer>=0.12",
    "networkx>=3.2",
    "rich>=13.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
siegegraph = "siegegraph.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["siegegraph"]
